# Render Blueprint, production. GENERATED by scripts/provision/render-blueprint.mjs --write from config/registry.json: do not edit.
# Manual sync only: no service deploys on a push or an image change (autoDeployTrigger: off). Images are deployed by
# digest through the release workflow; the url below names the repository only. Secrets are `sync: false`: the owner sets them
# in the Render dashboard (docs/ops/provisioning.md), never in this file. The registry path is PROVISION_IMAGE_PREFIX at generation.
databases:
  - name: 'shroomap-production-db'
    databaseName: 'shroomap'
    user: 'host_admin'
    plan: 'pro-4gb'
    region: 'frankfurt'
    postgresMajorVersion: '17'
    ipAllowList: []
services:
  - type: 'web'
    name: 'shroomap-production-web'
    runtime: 'image'
    image:
      url: 'ghcr.io/OWNER/REPOSITORY/web'
    region: 'frankfurt'
    plan: 'standard'
    autoDeployTrigger: 'off'
    healthCheckPath: '/'
    envVars:
      - key: 'APP_ENV'
        value: 'production'
      - key: 'WEB_ORIGIN'
        sync: false
      - key: 'CLERK_SECRET_KEY'
        sync: false
      - key: 'SENTRY_ENVIRONMENT'
        value: 'production'
      - key: 'NEXT_PUBLIC_API_ORIGIN'
        sync: false
      - key: 'NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY'
        sync: false
  - type: 'web'
    name: 'shroomap-production-api'
    runtime: 'image'
    image:
      url: 'ghcr.io/OWNER/REPOSITORY/api'
    region: 'frankfurt'
    plan: 'standard'
    autoDeployTrigger: 'off'
    healthCheckPath: '/health/ready'
    envVars:
      - key: 'APP_ENV'
        value: 'production'
      - key: 'API_PORT'
        value: '4000'
      - key: 'WEB_ORIGIN'
        sync: false
      - key: 'DATABASE_URL'
        sync: false
      - key: 'CLERK_SECRET_KEY'
        sync: false
      - key: 'CLERK_JWT_ISSUER'
        sync: false
      - key: 'KEK_PUBLIC_KEYS'
        sync: false
      - key: 'KEK_ACTIVE_VERSION'
        sync: false
      - key: 'KEY_FINGERPRINT_PEPPERS'
        sync: false
      - key: 'KEY_FINGERPRINT_PEPPER_ACTIVE'
        sync: false
      - key: 'R2_ENDPOINT'
        sync: false
      - key: 'R2_BUCKET'
        value: 'shroomap-production-app'
      - key: 'R2_ACCESS_KEY_ID'
        sync: false
      - key: 'R2_SECRET_ACCESS_KEY'
        sync: false
      - key: 'RATE_LIMIT_IP_KEY'
        sync: false
      - key: 'CURSOR_SIGNING_KEY'
        sync: false
      - key: 'SENTRY_ENVIRONMENT'
        value: 'production'
  - type: 'worker'
    name: 'shroomap-production-worker'
    runtime: 'image'
    image:
      url: 'ghcr.io/OWNER/REPOSITORY/worker'
    region: 'frankfurt'
    plan: 'standard'
    autoDeployTrigger: 'off'
    maxShutdownDelaySeconds: 120
    envVars:
      - key: 'APP_ENV'
        value: 'production'
      - key: 'DATABASE_URL'
        sync: false
      - key: 'CLERK_SECRET_KEY'
        sync: false
      - key: 'KEK_PUBLIC_KEYS'
        sync: false
      - key: 'KEK_ACTIVE_VERSION'
        sync: false
      - key: 'KEK_PRIVATE_KEYS'
        sync: false
      - key: 'R2_ENDPOINT'
        sync: false
      - key: 'R2_BUCKET'
        value: 'shroomap-production-app'
      - key: 'R2_ACCESS_KEY_ID'
        sync: false
      - key: 'R2_SECRET_ACCESS_KEY'
        sync: false
      - key: 'R2_LEDGER_BUCKET'
        value: 'shroomap-production-erasure-ledger'
      - key: 'R2_LEDGER_ACCESS_KEY_ID'
        sync: false
      - key: 'R2_LEDGER_SECRET_ACCESS_KEY'
        sync: false
      - key: 'WORKER_DRAIN_SECONDS'
        value: '90'
      - key: 'SENTRY_ENVIRONMENT'
        value: 'production'
  - type: 'pserv'
    name: 'shroomap-production-migrate'
    runtime: 'image'
    image:
      url: 'ghcr.io/OWNER/REPOSITORY/api'
    region: 'frankfurt'
    plan: 'starter'
    autoDeployTrigger: 'off'
    dockerCommand: 'node -e "setInterval(()=>{},3600000)"'
    envVars:
      - key: 'APP_ENV'
        value: 'production'
      - key: 'MIGRATION_DATABASE_URL'
        sync: false
  - type: 'cron'
    name: 'shroomap-production-backup'
    runtime: 'image'
    image:
      url: 'ghcr.io/OWNER/REPOSITORY/backup'
    region: 'frankfurt'
    plan: 'starter'
    autoDeployTrigger: 'off'
    schedule: '17 2 * * *'
    envVars:
      - key: 'APP_ENV'
        value: 'production'
      - key: 'R2_ENDPOINT'
        sync: false
      - key: 'R2_LEDGER_BUCKET'
        value: 'shroomap-production-erasure-ledger'
      - key: 'BACKUP_DATABASE_URL'
        sync: false
      - key: 'R2_BACKUP_SOURCE_ACCESS_KEY_ID'
        sync: false
      - key: 'R2_BACKUP_SOURCE_SECRET_ACCESS_KEY'
        sync: false
      - key: 'R2_BACKUP_SINK_ACCESS_KEY_ID'
        sync: false
      - key: 'R2_BACKUP_SINK_SECRET_ACCESS_KEY'
        sync: false
      - key: 'HEARTBEAT_URL_BACKUP'
        sync: false
      - key: 'BACKUP_AGE_RECIPIENT'
        sync: false
      - key: 'R2_BACKUP_BUCKET'
        value: 'shroomap-production-backup'
      - key: 'BACKUP_RETENTION_DAYS'
        value: '30'
  - type: 'cron'
    name: 'shroomap-production-monitor'
    runtime: 'image'
    image:
      url: 'ghcr.io/OWNER/REPOSITORY/api'
    region: 'frankfurt'
    plan: 'starter'
    autoDeployTrigger: 'off'
    schedule: '*/5 * * * *'
    dockerCommand: 'node scripts/monitor/src/main.ts'
    envVars:
      - key: 'APP_ENV'
        value: 'production'
      - key: 'SENTRY_ENVIRONMENT'
        value: 'production'
