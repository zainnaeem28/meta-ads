rules:
  - id: shroomap.no-eval
    languages: [javascript, typescript]
    severity: ERROR
    message: eval() and new Function() execute attacker-controlled strings
    pattern-either:
      - pattern: eval(...)
      - pattern: new Function(...)
  - id: shroomap.no-child-process-shell
    languages: [javascript, typescript]
    severity: ERROR
    message: exec() with a built command string allows shell injection; use execFile with an argument array
    patterns:
      - pattern-either:
          - pattern: $CP.exec($CMD, ...)
          - pattern: $CP.execSync($CMD, ...)
      - metavariable-regex:
          metavariable: $CP
          regex: ^(cp|child_process|childProcess)$
      - metavariable-pattern:
          metavariable: $CMD
          patterns:
            - pattern-not: '"..."'
  - id: shroomap.no-tls-verify-off
    languages: [javascript, typescript]
    severity: ERROR
    message: TLS certificate verification must not be disabled
    pattern-either:
      - pattern: '{..., rejectUnauthorized: false, ...}'
      - pattern: process.env.NODE_TLS_REJECT_UNAUTHORIZED = "0"
  - id: shroomap.no-dangerous-html
    languages: [typescript, javascript]
    severity: WARNING
    message: dangerouslySetInnerHTML bypasses React escaping
    pattern: <$X dangerouslySetInnerHTML={...} />
