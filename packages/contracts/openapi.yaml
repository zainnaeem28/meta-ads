        when the window has no request. ALR-9 fires when `telemetryDropped10m` is above 0 (TD-D42); the cumulative
        `telemetryDroppedTotal` cannot show a rise to a reader without stored state and is not an alert input. Token rule in the scope M convention (TD-D41). Exempt from rate limits; not
        audit-logged.
      x-api-id: API-903
      x-owner: platform
      x-scope: M
      security:
        - metricsToken: []
      x-error-codes: [not_found]
      responses:
        '200':
          description: Windowed summary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MetricsWindowResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

components:
  securitySchemes:
    sessionBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Identity provider session token (Clerk default), verified by JWKS (signature, issuer, authorized party, expiry). Roles and status are read from the users table on every request.
    metricsToken:
      type: http
      scheme: bearer
      description: The deployment's METRICS_TOKEN (opaque, at least 32 random bytes), held only by the monitor cron and the release observation step (SB v6 §7). Compared in constant time on SHA-256 digests. Used only by API-902 and API-903; never accepted on any other route, and a session token is never accepted here. Missing, wrong or unconfigured → 404 not_found.

  headers:
    XRequestId:
      description: Request correlation ID; equals metaData.requestId
      schema: { type: string, maxLength: 64 }
    Location:
      description: URL of the created or accepted resource
      schema: { type: string }
    ETag:
      description: Strong entity tag of the form "<version>" (for example "3"), echoed in If-Match
      schema: { type: string, pattern: '^"[0-9]+"$' }
    RetryAfter:
      description: Seconds until the request may be retried
      schema: { type: integer, minimum: 1 }

  parameters:
    Provider:
      name: provider
      in: path
      required: true
      schema: { $ref: '#/components/schemas/ProviderName' }
    DraftId:
      name: draftId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    MediaId:
      name: mediaId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    CampaignId:
      name: campaignId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    VideoJobId:
      name: videoJobId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    UserId:
      name: userId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    InvitationId:
      name: invitationId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    AccessRequestId:
      name: accessRequestId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    SegmentPosition:
      name: position
      in: path
      required: true
      schema: { type: integer, minimum: 1, maximum: 4 }
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque signed token from metaData.pagination.nextCursor. Invalid, tampered, expired or filter-incompatible → 400 validation_failed with detail field `cursor`.
      schema: { type: string, maxLength: 512 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Client-generated key (UUID recommended), scoped to the account and the operation, kept IDEMPOTENCY_TTL (24 h). Missing → 400 validation_failed; same key with a different body → 409 idempotency_key_reused; same key and body → the original result.
      schema: { type: string, minLength: 8, maxLength: 128, pattern: '^[A-Za-z0-9_\-]+$' }
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: The ETag from the last read ("<version>"). A mismatch → 409 version_conflict with no change (ADR-010 keeps 409 instead of 412).
      schema: { type: string, pattern: '^"[0-9]+"$' }
    ReportFrom:
      name: from
      in: query
      required: false
      description: Inclusive UTC instant; default now − 30 days
      schema: { type: string, format: date-time }
    ReportTo:
      name: to
      in: query
      required: false
      description: Exclusive UTC instant; default now; must be after from
      schema: { type: string, format: date-time }

  responses:
    BadRequest:
      description: validation_failed (malformed JSON, schema, missing Idempotency-Key, invalid cursor)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unauthenticated:
      description: unauthenticated (no valid session token); includes WWW-Authenticate Bearer
      headers:
        WWW-Authenticate:
          schema: { type: string }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Forbidden:
      description: not_linked, account_suspended, account_removed, mfa_required, recent_auth_required or forbidden_role (admin routes also write an audit event)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: not_found, identical for a missing and a foreign record (BR-22)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Conflict:
      description: version_conflict, state_conflict or idempotency_key_reused
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    PayloadTooLarge:
      description: payload_too_large (states the maximum)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    UnsupportedMediaType:
      description: unsupported_media_type (states the allowed types)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    BusinessRule:
      description: A 422 business-rule refusal; `code` is one of the operation's x-error-codes and `message` states the reason (for example the cap and estimate basis, the used and allowed storage, the clip name)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    RateLimited:
      description: rate_limited, with Retry-After
      headers:
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    InternalError:
      description: internal_error; generic message and the request ID only
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    MethodNotAllowed:
      description: |
        method_not_allowed: the path template exists but does not declare this method. Produced by the router before
        authentication, for every path, so it is not listed per operation (TD-D34, TD-D37). `Allow` lists the declared
        methods for the path template, plus `HEAD` when `GET` is declared, never `OPTIONS`, in the order
        `GET, HEAD, POST, PUT, PATCH, DELETE`, joined by ", ".
      headers:
        Allow:
          required: true
          description: Methods the path template accepts, for example `GET, HEAD, POST`
          schema: { type: string }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    ServiceUnavailable:
      description: service_unavailable (database unreachable, a statement or lock timeout, draining, a report data source failed, or no price row effective now for a job-creating call, in which case nothing is created); Retry-After when known
      headers:
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }

  schemas:
    Uuid:
      type: string
      format: uuid
    Instant:
      type: string
      format: date-time
    MoneyUsd:
      type: string
      pattern: '^-?[0-9]{1,8}\.[0-9]{4}$'
      description: USD decimal with 4 fraction digits, an estimate from the configured price table
    ProviderName:
      type: string
      enum: [openai, wavespeed]
    Role:
      type: string
      enum: [user, admin]
    AccountStatus:
      type: string
      enum: [active, suspended, removed]
    InvitationState:
      type: string
      enum: [invited, accepted, expired, revoked]

    ErrorCode:
      type: string
      description: Registry codes (shared-boundaries §6 plus the v3 delta). One status per code.
      enum:
        - validation_failed            # 400
        - unauthenticated              # 401
        - not_linked                   # 403
        - forbidden_role               # 403
        - mfa_required                 # 403
        - recent_auth_required         # 403
        - account_suspended            # 403
        - account_removed              # 403
        - not_found                    # 404
        - method_not_allowed           # 405 (v3 delta)
        - version_conflict             # 409
        - state_conflict               # 409
        - idempotency_key_reused       # 409
        - payload_too_large            # 413
        - unsupported_media_type       # 415
        - key_missing                  # 422
        - key_disabled                 # 422
        - key_invalid                  # 422
        - storage_quota_reached        # 422
        - media_not_ready              # 422
        - open_claim_issues            # 422
        - claim_not_clearable          # 422
        - brief_not_accepted           # 422
        - spend_cap_reached            # 422
        - assembly_daily_limit         # 422
        - clip_not_completed           # 422
        - qc_confirmation_required     # 422 (v3 delta)
        - last_admin                   # 422
        - self_action                  # 422
        - confirmation_mismatch        # 422
        - invite_domain_not_allowed    # 422
        - signup_open_prerequisites    # 422
        - report_window_too_large      # 422
        - rate_limited                 # 429
        - internal_error               # 500 (v3 delta)
        - service_unavailable          # 503 (v3 delta)

    MetaData:
      type: object
      required: [requestId, timestamp]
      additionalProperties: false
      properties:
        requestId: { type: string, maxLength: 64 }
        timestamp: { $ref: '#/components/schemas/Instant' }

    CursorPagination:
      type: object
      required: [type, limit, returnedCount, hasNextPage, nextCursor]
      additionalProperties: false
      properties:
        type: { type: string, const: cursor }
        limit: { type: integer, minimum: 1, maximum: 50 }
        returnedCount: { type: integer, minimum: 0, maximum: 50 }
        hasNextPage: { type: boolean }
        nextCursor:
          type: [string, 'null']
          maxLength: 512
      oneOf:
        - required: [hasNextPage, nextCursor]
          properties: { hasNextPage: { const: true }, nextCursor: { type: string } }
        - required: [hasNextPage, nextCursor]
          properties: { hasNextPage: { const: false }, nextCursor: { type: 'null' } }

    PageMetaData:
      type: object
      description: MetaData of a list response. A separate closed object (not allOf over MetaData, whose additionalProperties false would reject pagination).
      required: [requestId, timestamp, pagination]
      additionalProperties: false
      properties:
        requestId: { type: string, maxLength: 64 }
        timestamp: { $ref: '#/components/schemas/Instant' }
        pagination: { $ref: '#/components/schemas/CursorPagination' }

    ErrorDetail:
      type: object
      required: [field, code, message]
      additionalProperties: false
      properties:
        field: { type: string, maxLength: 200, description: 'Public DTO path, for example segments.0.dialogue' }
        code: { type: string, maxLength: 64, description: 'Detail code, for example required, too_long, out_of_range, invalid_format, cursor_invalid' }
        message: { type: string, maxLength: 300 }

    ErrorResponse:
      type: object
      required: [success, error, metaData]
      additionalProperties: false
      properties:
        success: { type: boolean, const: false }
        error:
          type: object
          required: [code, message]
          additionalProperties: false
          properties:
            code: { $ref: '#/components/schemas/ErrorCode' }
            message: { type: string, maxLength: 500 }
            details:
              type: array
              maxItems: 50
              items: { $ref: '#/components/schemas/ErrorDetail' }
        metaData: { $ref: '#/components/schemas/MetaData' }

    # ---------- job summary shared by every provider job ----------
    JobLabel:
      type: string
      description: User-facing label (ARCH-G1 §5.3 mapping; SB §3.5)
      enum: [pending, queued, created, processing, completed, failed]
    JobState:
      type: string
      enum: [pending, submitting, submitted, processing, completed, failed, cancelled]
    CauseClass:
      type: string
      enum: [temporary, configuration, credit, provider_timeout, key_replaced, key_deleted, reference_unreachable, output_unreachable, outcome_unknown, cancelled_campaign_deleted, cancelled_account_suspended, cancelled_account_removed]
    JobSummary:
      type: object
      required: [id, state, label, causeClass, causeMessage, createdAt, updatedAt, reused]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        state: { $ref: '#/components/schemas/JobState' }
        label: { $ref: '#/components/schemas/JobLabel' }
        causeClass:
          oneOf:
            - $ref: '#/components/schemas/CauseClass'
            - type: 'null'
        causeMessage:
          type: [string, 'null']
          maxLength: 300
          description: Safe message; names whose key for configuration and credit causes; for outcome_unknown says to check the provider account before retrying
        createdAt: { $ref: '#/components/schemas/Instant' }
        updatedAt: { $ref: '#/components/schemas/Instant' }
        deadlineAt:
          oneOf:
            - $ref: '#/components/schemas/Instant'
            - type: 'null'
        reused:
          type: boolean
          description: true when a job-creating call returned an existing job; false on reads

    # ---------- identity ----------
    MeLinked:
      type: object
      required: [linkState, id, role, status, mfa, recentAuth, keyNotices]
      properties:
        linkState: { type: string, const: linked }
        id: { $ref: '#/components/schemas/Uuid' }
        role: { $ref: '#/components/schemas/Role' }
        status: { type: string, const: active }
        mfa:
          type: object
          required: [required, satisfied]
          properties:
            required: { type: boolean }
            satisfied: { type: boolean }
        recentAuth:
          type: object
          required: [satisfied, maxAgeSeconds]
          properties:
            satisfied: { type: boolean }
            maxAgeSeconds: { type: integer }
        keyNotices:
          type: array
          description: Persistent notices for disabled keys (shown on every page until replaced)
          items:
            type: object
            required: [provider, status]
            properties:
              provider: { $ref: '#/components/schemas/ProviderName' }
              status: { type: string, enum: [disabled, missing] }
    MeNotLinked:
      type: object
      required: [linkState, accessRequest]
      properties:
        linkState: { type: string, const: not_linked }
        accessRequest:
          type: object
          required: [formEnabled, state]
          properties:
            formEnabled: { type: boolean }
            state: { type: string, enum: [none, pending, declined] }
    MeResponse:
      type: object
      required: [success, data, metaData]
      properties:
        success: { type: boolean, const: true }
        data:
          oneOf:
            - $ref: '#/components/schemas/MeLinked'
            - $ref: '#/components/schemas/MeNotLinked'
        metaData: { $ref: '#/components/schemas/MetaData' }

    AccessRequestCreate:
      type: object
      additionalProperties: false
      properties:
        note: { type: string, maxLength: 500, description: "Optional free text for the admin; never logged" }
    AccessRequestAcceptedResponse:
      type: object
      required: [success, data, metaData]
      properties:
        success: { type: boolean, const: true }
        data:
          type: object
          required: [state]
          properties:
            state: { type: string, const: received }
        metaData: { $ref: '#/components/schemas/MetaData' }

    # ---------- provider keys ----------
    ProviderKeyStatus:
      type: object
      required: [provider, configured, status, last4, fingerprint, version, createdAt, updatedAt, lastValidatedAt, inFlightJobCount]
      properties:
        provider: { $ref: '#/components/schemas/ProviderName' }
        configured: { type: boolean }
        status:
          type: [string, 'null']
          enum: [active, untested, disabled, null]
        last4: { type: [string, 'null'], pattern: '^.{4}$' }
        fingerprint: { type: [string, 'null'], pattern: '^[0-9a-f]{12}$', description: "First 12 hex of HMAC-SHA-256(pepper, key)" }
        version: { type: [integer, 'null'], minimum: 1 }
        createdAt:
          oneOf: [{ $ref: '#/components/schemas/Instant' }, { type: 'null' }]
        updatedAt:
          oneOf: [{ $ref: '#/components/schemas/Instant' }, { type: 'null' }]
        lastValidatedAt:
          oneOf: [{ $ref: '#/components/schemas/Instant' }, { type: 'null' }]
        inFlightJobCount: { type: integer, minimum: 0, description: "Jobs in submitting, submitted or processing on this key (for the replace and delete warning)" }
    ProviderKeyListResponse:
      type: object
      required: [success, data, metaData]
      properties:
        success: { type: boolean, const: true }
        data:
          type: array
          minItems: 2
          maxItems: 2
          items: { $ref: '#/components/schemas/ProviderKeyStatus' }
        metaData: { $ref: '#/components/schemas/MetaData' }
    ProviderKeyPut:
      type: object
      required: [apiKey]
      additionalProperties: false
      properties:
        apiKey:
          type: string
          minLength: 20
          maxLength: 512
          writeOnly: true
          description: Trimmed of surrounding whitespace; format checked per provider (KEY_FORMAT rules, ARCHITECTURE.md §5.2); never echoed or logged
    ProviderKeyPutResponse:
      type: object
      required: [success, data, metaData]
      properties:
        success: { type: boolean, const: true }
        data:
          allOf:
            - $ref: '#/components/schemas/ProviderKeyStatus'
            - type: object
              required: [probe]
              properties:
                probe: { type: string, enum: [valid, unknown], description: "unknown means stored as untested" }
        metaData: { $ref: '#/components/schemas/MetaData' }
    KeyEventKind:
      type: string
      enum: [added, replaced, deleted, test_passed, test_failed, stored_untested, validated_by_job, auth_failed, disabled, disabled_by_operator, attempt_rate_limited, rewrapped]
    KeyEvent:
      type: object
      required: [id, provider, kind, at]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        provider: { $ref: '#/components/schemas/ProviderName' }
        kind: { $ref: '#/components/schemas/KeyEventKind' }
        at: { $ref: '#/components/schemas/Instant' }
    KeyEventPage:
      type: object
      required: [success, data, metaData]
      properties:
        success: { type: boolean, const: true }
        data: { type: array, maxItems: 50, items: { $ref: '#/components/schemas/KeyEvent' } }
        metaData: { $ref: '#/components/schemas/PageMetaData' }

    # ---------- drafts and campaigns ----------
    Audience:
      type: object
      additionalProperties: false
      properties:
        ageMin: { type: integer, minimum: 21, maximum: 99 }
        ageMax: { type: integer, minimum: 21, maximum: 99, description: "Must be >= ageMin" }
        gender: { type: string, enum: [all, female, male] }
        interests:
          type: array
          maxItems: 10
          items: { type: string, minLength: 1, maxLength: 40 }
    Direction:
      type: object
      additionalProperties: false
      properties:
        goal: { type: string, enum: [awareness, conversion, retention] }
        tone: { type: string, minLength: 1, maxLength: 60 }
        segmentCount: { type: integer, minimum: 1, maximum: 4 }
    DraftWrite:
      type: object
      additionalProperties: false
      description: All fields optional while drafting; null clears a field; completeness is checked at submit
      properties:
        step: { type: integer, minimum: 1, maximum: 5 }
        adStyle: { type: string, enum: [ugc] }
        intakeMode: { type: string, enum: [description, script] }
        productName: { type: [string, 'null'], minLength: 1, maxLength: 120 }
        productDescription: { type: [string, 'null'], maxLength: 2000 }
        audience:
          oneOf: [{ $ref: '#/components/schemas/Audience' }, { type: 'null' }]
        direction:
          oneOf: [{ $ref: '#/components/schemas/Direction' }, { type: 'null' }]
        concept: { type: [string, 'null'], maxLength: 4000 }
        script: { type: [string, 'null'], maxLength: 4000 }
        productMediaId:
          oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }]
    DraftPatch:
      allOf:
        - $ref: '#/components/schemas/DraftWrite'
        - type: object
          minProperties: 1
    Draft:
      type: object
      required: [id, version, step, adStyle, intakeMode, productName, productDescription, audience, direction, concept, script, productMediaId, campaignId, durationSeconds, createdAt, updatedAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        version: { type: integer, minimum: 1 }
        step: { type: integer, minimum: 1, maximum: 5 }
        adStyle: { type: string, enum: [ugc] }
        intakeMode: { type: string, enum: [description, script] }
        productName: { type: [string, 'null'] }
        productDescription: { type: [string, 'null'] }
        audience:
          oneOf: [{ $ref: '#/components/schemas/Audience' }, { type: 'null' }]
        direction:
          oneOf: [{ $ref: '#/components/schemas/Direction' }, { type: 'null' }]
        concept: { type: [string, 'null'] }
        script: { type: [string, 'null'] }
        productMediaId:
          oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }]
        campaignId:
          oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }]
          description: Set once submitted; the draft is then read-only (SB-D13)
        durationSeconds: { type: [integer, 'null'], enum: [15, 30, 45, 60, null], description: "segmentCount \u00d7 15" }
        createdAt: { $ref: '#/components/schemas/Instant' }
        updatedAt: { $ref: '#/components/schemas/Instant' }
    DraftResponse:
      type: object
      required: [success, data, metaData]
      properties:
        success: { type: boolean, const: true }
        data: { $ref: '#/components/schemas/Draft' }
        metaData: { $ref: '#/components/schemas/MetaData' }
    DraftPage:
      type: object
      required: [success, data, metaData]
      properties:
        success: { type: boolean, const: true }
        data: { type: array, maxItems: 50, items: { $ref: '#/components/schemas/Draft' } }
        metaData: { $ref: '#/components/schemas/PageMetaData' }
    SubmitDraftResponse:
      type: object
      required: [success, data, metaData]
      properties:
        success: { type: boolean, const: true }
        data:
          type: object
          required: [campaignId, briefJob]
          properties:
            campaignId: { $ref: '#/components/schemas/Uuid' }
            briefJob: { $ref: '#/components/schemas/JobSummary' }
        metaData: { $ref: '#/components/schemas/MetaData' }
    CampaignProgress:
      type: string
      enum: [in_progress, processing, completed, failed]
      description: Derived at read (ARCHITECTURE.md §3.2); filter values map to processing, completed, failed
    CampaignSummary:
      type: object
      required: [id, productName, productDescriptionExcerpt, progress, briefState, segmentCount, finalAvailable, createdAt, updatedAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        productName: { type: string }
        productDescriptionExcerpt: { type: string, maxLength: 160 }
        progress: { $ref: '#/components/schemas/CampaignProgress' }
        briefState: { type: string, enum: [generating, draft, accepted, failed] }
        segmentCount: { type: integer, minimum: 1, maximum: 4 }
        finalAvailable: { type: boolean }
        createdAt: { $ref: '#/components/schemas/Instant' }
        updatedAt: { $ref: '#/components/schemas/Instant' }
    CampaignPage:
      type: object
      required: [success, data, metaData]
      properties:
        success: { type: boolean, const: true }
        data: { type: array, maxItems: 50, items: { $ref: '#/components/schemas/CampaignSummary' } }
        metaData: { $ref: '#/components/schemas/PageMetaData' }
    Campaign:
      allOf:
        - $ref: '#/components/schemas/CampaignSummary'
        - type: object
          required: [productDescription, productMediaId, draftId, jobCounts, latestAssemblyId, thumbstopperJobId]
          properties:
            productDescription: { type: string }
            productMediaId:
              oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }]
            draftId: { $ref: '#/components/schemas/Uuid' }
            jobCounts:
              type: object
              description: Latest job per segment, counted by label
              additionalProperties: { type: integer, minimum: 0 }
            latestAssemblyId:
              oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }]
            thumbstopperJobId:
              oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }]
    CampaignResponse:
      type: object
      required: [success, data, metaData]
      properties:
        success: { type: boolean, const: true }
        data: { $ref: '#/components/schemas/Campaign' }
        metaData: { $ref: '#/components/schemas/MetaData' }
    DeletionAcceptedResponse:
      type: object
      required: [success, data, metaData]
      properties:
        success: { type: boolean, const: true }
        data:
          type: object
          required: [deletionRunId, state]
          properties:
            deletionRunId: { $ref: '#/components/schemas/Uuid' }
            state: { type: string, const: running }
        metaData: { $ref: '#/components/schemas/MetaData' }

    # ---------- media ----------
    MediaRejectReason:
      type: string
      enum: [type_not_allowed, pixel_cap_exceeded, decompression_bomb, decode_failed]
    Media:
      type: object
      required: [id, kind, state, contentType, bytes, width, height, rejectReason, attached, campaignId, createdAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        kind: { type: string, enum: [upload, clip, final, thumbstopper] }
        state: { type: string, enum: [processing, ready, rejected] }
        contentType: { type: [string, 'null'], enum: [image/jpeg, image/png, image/webp, image/gif, video/mp4, null] }
        bytes: { type: [integer, 'null'], minimum: 0 }
        width: { type: [integer, 'null'], minimum: 1 }
        height: { type: [integer, 'null'], minimum: 1 }
        rejectReason:
          oneOf: [{ $ref: '#/components/schemas/MediaRejectReason' }, { type: 'null' }]
        attached: { type: boolean }
        campaignId:
          oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }]
        createdAt: { $ref: '#/components/schemas/Instant' }
    MediaResponse:
      type: object
      required: [success, data, metaData]
      properties:
        success: { type: boolean, const: true }
        data: { $ref: '#/components/schemas/Media' }
        metaData: { $ref: '#/components/schemas/MetaData' }
    SignedUrlResponse:
      type: object
      required: [success, data, metaData]
      properties:
        success: { type: boolean, const: true }
        data:
          type: object
          required: [url, expiresAt]
          properties:
            url: { type: string, format: uri, description: "Storage origin, one object, GET only; never logged" }
            expiresAt: { $ref: '#/components/schemas/Instant' }
        metaData: { $ref: '#/components/schemas/MetaData' }
    ImageAnalysisResponse:
      type: object
      required: [success, data, metaData]
      properties:
        success: { type: boolean, const: true }
        data:
          type: object
          required: [job, productDescription]
          properties:
            job:
              oneOf: [{ $ref: '#/components/schemas/JobSummary' }, { type: 'null' }]
            productDescription:
              type: [string, 'null']
              maxLength: 1500
              description: Product-only description after the sensitive-attribute filter (REQ-006, PM-D13)
        metaData: { $ref: '#/components/schemas/MetaData' }

    # ---------- brief ----------
    Segment:
      type: object
      required: [position, state, revision, dialogue, prompt, wordCount]
      properties:
        position: { type: integer, minimum: 1, maximum: 4 }
        state: { type: string, enum: [active, retired] }
        revision: { type: integer, minimum: 1 }
        dialogue: { type: string, maxLength: 600 }
        prompt: { type: string, maxLength: 2000 }
        wordCount: { type: integer, minimum: 0 }
    ClaimIssue:
      type: object
      required: [id, segmentPosition, field, ruleId, class, resolution, message, clearReason]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        segmentPosition: { type: integer, minimum: 1, maximum: 4 }
        field: { type: string, enum: [dialogue, prompt] }
        ruleId: { type: string, maxLength: 64, description: 'brand_rules rule ID, for example BR-06-cure-claim' }
        class: { type: string, enum: [high_risk, other] }
        resolution: { type: string, enum: [open, closed_by_edit, cleared_with_reason] }
        message: { type: string, maxLength: 300 }
        span:
          type: [object, 'null']
          properties:
            start: { type: integer, minimum: 0 }
            end: { type: integer, minimum: 0 }
        clearReason: { type: [string, 'null'], maxLength: 500 }
    Brief:
      type: object
      required: [id, campaignId, state, version, acceptedAt, generationJob, segments, issues, updatedAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        campaignId: { $ref: '#/components/schemas/Uuid' }
        state: { type: string, enum: [generating, draft, accepted, failed] }
        version: { type: integer, minimum: 1 }
        acceptedAt:
          oneOf: [{ $ref: '#/components/schemas/Instant' }, { type: 'null' }]
        generationJob:
          oneOf: [{ $ref: '#/components/schemas/JobSummary' }, { type: 'null' }]
        segments: { type: array, maxItems: 4, items: { $ref: '#/components/schemas/Segment' } }
        issues: { type: array, maxItems: 200, items: { $ref: '#/components/schemas/ClaimIssue' }, description: "Open issues plus issues resolved since the last accept" }
        updatedAt: { $ref: '#/components/schemas/Instant' }
    BriefResponse:
      type: object
      required: [success, data, metaData]
      properties:
        success: { type: boolean, const: true }
        data: { $ref: '#/components/schemas/Brief' }
        metaData: { $ref: '#/components/schemas/MetaData' }
    BriefPatch:
      type: object
      required: [segments]
      additionalProperties: false
      properties:
        segments:
          type: array
          minItems: 1
          maxItems: 4
          items:
            type: object
            required: [position]
            additionalProperties: false
            minProperties: 2
            properties:
              position: { type: integer, minimum: 1, maximum: 4 }
              dialogue: { type: string, minLength: 1, maxLength: 600 }
              prompt: { type: string, minLength: 1, maxLength: 2000 }
    BriefJobResponse:
      type: object
      required: [success, data, metaData]
      properties:
        success: { type: boolean, const: true }
        data:
          type: object
          required: [briefState, job]
          properties:
            briefState: { type: string, enum: [generating] }
            job: { $ref: '#/components/schemas/JobSummary' }
        metaData: { $ref: '#/components/schemas/MetaData' }
    ClearClaimIssue:
      type: object
      required: [reason]
      additionalProperties: false
      properties:
        reason: { type: string, minLength: 3, maxLength: 500 }
    ClaimIssueResponse:
      type: object
      required: [success, data, metaData]
      properties:
        success: { type: boolean, const: true }
        data: { $ref: '#/components/schemas/ClaimIssue' }
        metaData: { $ref: '#/components/schemas/MetaData' }

    # ---------- production ----------
    GenerateSegment:
      type: object
      additionalProperties: false
      properties:
        useProductImage: { type: boolean, default: true, description: "Send the campaign's ready product image as the reference" }
    QcState:
      type: string
      enum: [pending, passed, failed, skipped]
    QcRun:
      allOf:
        - $ref: '#/components/schemas/JobSummary'
        - type: object
          required: [videoJobId, qcState, reason]
          properties:
            videoJobId: { $ref: '#/components/schemas/Uuid' }
            qcState: { $ref: '#/components/schemas/QcState' }
            reason:
              type: [string, 'null']
              maxLength: 300
              description: For failed (mismatch summary, no full transcript) or skipped (cause)
    QcRunResponse:
      type: object
      required: [success, data, metaData]
      properties:
        success: { type: boolean, const: true }
        data: { $ref: '#/components/schemas/QcRun' }
        metaData: { $ref: '#/components/schemas/MetaData' }
    VideoJob:
      allOf:
        - $ref: '#/components/schemas/JobSummary'
        - type: object
          required: [campaignId, segmentPosition, segmentRevision, outOfDate, outputMediaId, latestQc, qcHistory]
          properties:
            campaignId: { $ref: '#/components/schemas/Uuid' }
            segmentPosition: { type: integer, minimum: 1, maximum: 4 }
            segmentRevision: { type: integer, minimum: 1 }
            outOfDate: { type: boolean, description: "segmentRevision < current segment revision (SB-D11)" }
            outputMediaId:
              oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }]
            latestQc:
              oneOf: [{ $ref: '#/components/schemas/QcRun' }, { type: 'null' }]
            qcHistory:
              type: array
              maxItems: 20
              items: { $ref: '#/components/schemas/QcRun' }
    VideoJobResponse:
      type: object
      required: [success, data, metaData]
      properties:
        success: { type: boolean, const: true }
        data: { $ref: '#/components/schemas/VideoJob' }
        metaData: { $ref: '#/components/schemas/MetaData' }
    SegmentJobsResponse:
      type: object
      required: [success, data, metaData]
      properties:
        success: { type: boolean, const: true }
        data:
          type: array
          maxItems: 4
          items:
            type: object
            required: [position, segmentState, segmentRevision, latestJob]
            properties:
              position: { type: integer, minimum: 1, maximum: 4 }
              segmentState: { type: string, enum: [active, retired] }
              segmentRevision: { type: integer, minimum: 1 }
              latestJob:
                oneOf: [{ $ref: '#/components/schemas/VideoJob' }, { type: 'null' }]
        metaData: { $ref: '#/components/schemas/MetaData' }
    AssemblyCreate:
      type: object
      required: [clips]
      additionalProperties: false
      properties:
        clips:
          type: array
          minItems: 1
          maxItems: 4
          uniqueItems: true
          items: { $ref: '#/components/schemas/Uuid' }
          description: Ordered video job IDs
        thumbstopperJobId:
          oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }]
          description: Optional completed thumbstopper shown as the opening frame (THUMBSTOPPER_FRAME_SECONDS)
        confirmations:
          type: object
          additionalProperties: false
          properties:
            qcOverride:
              type: array
              maxItems: 4
              uniqueItems: true
              items: { $ref: '#/components/schemas/Uuid' }
              description: Video job IDs whose failed or skipped QC the user explicitly accepts (REQ-010). Each must be in `clips` (else 400 `validation_failed`); an ID whose latest QC is `passed` or `pending` is ignored and not recorded (TD-D35)
    AssemblyState:
      type: string
      enum: [pending, queued, fetching, rendering, saving, done, failed]
    Assembly:
      type: object
      required: [id, campaignId, state, clips, thumbstopperJobId, outOfDate, outputMediaId, causeClass, causeMessage, createdAt, updatedAt, reused]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        campaignId: { $ref: '#/components/schemas/Uuid' }
        state: { $ref: '#/components/schemas/AssemblyState' }
        clips:
          type: array
          maxItems: 4
          items:
            type: object
            required: [position, videoJobId, outOfDate, qcOverrideConfirmed]
            properties:
              position: { type: integer, minimum: 1, maximum: 4 }
              videoJobId: { $ref: '#/components/schemas/Uuid' }
              outOfDate: { type: boolean }
              qcOverrideConfirmed: { type: boolean }
        thumbstopperJobId:
          oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }]
        outOfDate: { type: boolean, description: "Any clip out of date, or a newer completed job exists for a clip's segment (SB-D11)" }
        outputMediaId:
          oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }]
        causeClass:
          type: [string, 'null']
          enum: [render_failed, input_unavailable, timeout, cancelled_campaign_deleted, cancelled_account_suspended, cancelled_account_removed, null]
        causeMessage: { type: [string, 'null'], maxLength: 300 }
        createdAt: { $ref: '#/components/schemas/Instant' }
        updatedAt: { $ref: '#/components/schemas/Instant' }
        reused: { type: boolean }
    AssemblyResponse:
      type: object
      required: [success, data, metaData]
      properties:
        success: { type: boolean, const: true }
        data: { $ref: '#/components/schemas/Assembly' }
        metaData: { $ref: '#/components/schemas/MetaData' }
    ThumbstopperCreate:
      type: object
      required: [calloutText]
      additionalProperties: false
      properties:
        calloutText: { type: string, minLength: 1, maxLength: 80, description: "Checked by the deterministic claim rules before the job is created; any issue returns 422 open_claim_issues with details[].field calloutText and the rule ID as detail code" }
    Thumbstopper:
      allOf:
        - $ref: '#/components/schemas/JobSummary'
        - type: object
          required: [campaignId, calloutText, outputMediaId]
          properties:
            campaignId: { $ref: '#/components/schemas/Uuid' }
            calloutText: { type: string }
            outputMediaId:
              oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }]
    ThumbstopperResponse:
      type: object
      required: [success, data, metaData]
      properties:
        success: { type: boolean, const: true }
        data:
          oneOf: [{ $ref: '#/components/schemas/Thumbstopper' }, { type: 'null' }]
        metaData: { $ref: '#/components/schemas/MetaData' }

    # ---------- admin ----------
    AdminUser:
      type: object
      required: [id, email, role, status, version, createdAt, updatedAt, erasure]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        email: { type: string, format: email, description: "Shown on this screen only (PRD \u00a73.1)" }
        role: { $ref: '#/components/schemas/Role' }
        status: { $ref: '#/components/schemas/AccountStatus' }
        version: { type: integer, minimum: 1 }
        createdAt: { $ref: '#/components/schemas/Instant' }
        updatedAt: { $ref: '#/components/schemas/Instant' }
        erasure:
          type: [object, 'null']
          description: Present while status is removed
          properties:
            deletionRunId: { $ref: '#/components/schemas/Uuid' }
            step: { type: integer, minimum: 1, maximum: 5 }
            state: { type: string, enum: [running, completed, stuck] }
    AdminUserResponse:
      type: object
      required: [success, data, metaData]
      properties:
        success: { type: boolean, const: true }
        data: { $ref: '#/components/schemas/AdminUser' }
        metaData: { $ref: '#/components/schemas/MetaData' }
    AdminUserPage:
      type: object
      required: [success, data, metaData]
      properties:
        success: { type: boolean, const: true }
        data: { type: array, maxItems: 50, items: { $ref: '#/components/schemas/AdminUser' } }
        metaData: { $ref: '#/components/schemas/PageMetaData' }
    RemoveUser:
      type: object
      required: [confirmation]
      additionalProperties: false
      properties:
        confirmation: { type: string, minLength: 3, maxLength: 320, description: "The account email typed by the admin" }
    SetRole:
      type: object
      required: [role]
      additionalProperties: false
      properties:
        role: { $ref: '#/components/schemas/Role' }
    DeletionRun:
      type: object
      required: [id, kind, subjectId, step, state, attempts, remainingObjects, updatedAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        kind: { type: string, enum: [account] }
        subjectId: { $ref: '#/components/schemas/Uuid' }
        step: { type: integer, minimum: 1, maximum: 5 }
        state: { type: string, enum: [running, completed, stuck] }
        attempts: { type: integer, minimum: 0 }
        remainingObjects: { type: [integer, 'null'], minimum: 0 }
        updatedAt: { $ref: '#/components/schemas/Instant' }
    DeletionRunPage:
      type: object
      required: [success, data, metaData]
      properties:
        success: { type: boolean, const: true }
        data: { type: array, maxItems: 50, items: { $ref: '#/components/schemas/DeletionRun' } }
        metaData: { $ref: '#/components/schemas/PageMetaData' }
    Invitation:
      type: object
      required: [id, email, state, sendState, expiresAt, invitedBy, createdAt, updatedAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        email: { type: string, format: email }
        state: { $ref: '#/components/schemas/InvitationState' }
        sendState: { type: string, enum: [pending, sent, send_failed] }
        expiresAt: { $ref: '#/components/schemas/Instant' }
        invitedBy:
          oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }]
        createdAt: { $ref: '#/components/schemas/Instant' }
        updatedAt: { $ref: '#/components/schemas/Instant' }
    InvitationResponse:
      type: object
      required: [success, data, metaData]
      properties:
        success: { type: boolean, const: true }
        data: { $ref: '#/components/schemas/Invitation' }
        metaData: { $ref: '#/components/schemas/MetaData' }
    InvitationPage:
      type: object
      required: [success, data, metaData]
      properties:
        success: { type: boolean, const: true }
        data: { type: array, maxItems: 50, items: { $ref: '#/components/schemas/Invitation' } }
        metaData: { $ref: '#/components/schemas/PageMetaData' }
    InvitationCreate:
      type: object
      required: [email]
      additionalProperties: false
      properties:
        email: { type: string, format: email, maxLength: 320 }
    InvitationAcceptedResponse:
      type: object
      required: [success, data, metaData]
      properties:
        success: { type: boolean, const: true }
        data:
          type: object
          required: [email, message]
          properties:
            email: { type: string, format: email }
            message: { type: string, const: 'If this address can be invited, an invitation is on its way.' }
        metaData: { $ref: '#/components/schemas/MetaData' }
    AccessRequest:
      type: object
      required: [id, email, state, note, createdAt, decidedAt, decidedBy]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        email: { type: string, format: email }
        state: { type: string, enum: [pending, approved, declined] }
        note: { type: [string, 'null'], maxLength: 500 }
        createdAt: { $ref: '#/components/schemas/Instant' }
        decidedAt:
          oneOf: [{ $ref: '#/components/schemas/Instant' }, { type: 'null' }]
        decidedBy:
          oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }]
        userId:
          oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }]
          description: Set on approve
    AccessRequestResponse:
      type: object
      required: [success, data, metaData]
      properties:
        success: { type: boolean, const: true }
        data: { $ref: '#/components/schemas/AccessRequest' }
        metaData: { $ref: '#/components/schemas/MetaData' }
    AccessRequestPage:
      type: object
      required: [success, data, metaData]
      properties:
        success: { type: boolean, const: true }
        data: { type: array, maxItems: 50, items: { $ref: '#/components/schemas/AccessRequest' } }
        metaData: { $ref: '#/components/schemas/PageMetaData' }
    Settings:
      type: object
      required: [signupMode, accessRequestFormEnabled, mfaRequiredFor, inviteEmailDomains, openModePrerequisites]
      properties:
        signupMode: { type: string, enum: [invited_only, open] }
        accessRequestFormEnabled: { type: boolean, readOnly: true }
        mfaRequiredFor: { type: string, enum: [all, admins], readOnly: true }
        inviteEmailDomains: { type: array, items: { type: string }, readOnly: true }
        openModePrerequisites:
          type: object
          readOnly: true
          required: [emailVerificationRequired, signupRateLimitEnabled, abuseLimitsEnabled, verificationRecordId]
          properties:
            emailVerificationRequired: { type: boolean }
            signupRateLimitEnabled: { type: boolean }
            abuseLimitsEnabled: { type: boolean }
            verificationRecordId: { type: [string, 'null'], maxLength: 120 }
    SettingsResponse:
      type: object
      required: [success, data, metaData]
      properties:
        success: { type: boolean, const: true }
        data: { $ref: '#/components/schemas/Settings' }
        metaData: { $ref: '#/components/schemas/MetaData' }
    SetSignupMode:
      type: object
      required: [mode]
      additionalProperties: false
      properties:
        mode: { type: string, enum: [invited_only, open] }
    AlertKind:
      type: string
      enum: [campaign_deletion_stuck, account_erasure_stuck, job_burst, provider_auth_spike, admin_role_changed, reservation_inconsistency, key_unseal_failed, keys_disabled_all]
    Alert:
      type: object
      required: [id, kind, subjectUserId, raisedAt, acknowledgedAt, acknowledgedBy, counts]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        kind: { $ref: '#/components/schemas/AlertKind' }
        subjectUserId:
          oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }]
        raisedAt: { $ref: '#/components/schemas/Instant' }
        acknowledgedAt:
          oneOf: [{ $ref: '#/components/schemas/Instant' }, { type: 'null' }]
        acknowledgedBy:
          oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }]
        counts:
          type: object
          description: IDs-free numeric facts only (for example jobs, window_minutes, remaining_objects)
          additionalProperties: { type: integer }
    AlertResponse:
      type: object
      required: [success, data, metaData]
      properties:
        success: { type: boolean, const: true }
        data: { $ref: '#/components/schemas/Alert' }
        metaData: { $ref: '#/components/schemas/MetaData' }
    AlertPage:
      type: object
      required: [success, data, metaData]
      properties:
        success: { type: boolean, const: true }
        data: { type: array, maxItems: 50, items: { $ref: '#/components/schemas/Alert' } }
        metaData: { $ref: '#/components/schemas/PageMetaData' }
    ProviderUsage:
      type: object
      required: [provider, calls, succeeded, failed, rejected, unconfirmed, estimatedCostUsd, latencyP50Ms, latencyP95Ms]
      properties:
        provider: { type: string, enum: [openai, wavespeed, assembly_vendor] }
        calls: { type: integer, minimum: 0 }
        succeeded: { type: integer, minimum: 0 }
        failed: { type: integer, minimum: 0 }
        rejected: { type: integer, minimum: 0 }
        unconfirmed: { type: integer, minimum: 0 }
        estimatedCostUsd: { $ref: '#/components/schemas/MoneyUsd' }
        latencyP50Ms: { type: [integer, 'null'], minimum: 0 }
        latencyP95Ms: { type: [integer, 'null'], minimum: 0 }
    UsageReport:
      type: object
      required: [from, to, asOf, empty, costBasis, accounts, providers, jobStates, claimChecks]
      properties:
        from: { $ref: '#/components/schemas/Instant' }
        to: { $ref: '#/components/schemas/Instant' }
        asOf: { $ref: '#/components/schemas/Instant' }
        empty: { type: boolean }
        costBasis: { type: string, const: estimate_from_configured_price_table }
        accounts:
          type: array
          items:
            type: object
            required: [userId, providers]
            properties:
              userId: { $ref: '#/components/schemas/Uuid' }
              providers: { type: array, items: { $ref: '#/components/schemas/ProviderUsage' } }
        providers: { type: array, items: { $ref: '#/components/schemas/ProviderUsage' } }
        jobStates:
          type: object
          description: Count of jobs created in the window by user label
          additionalProperties: { type: integer, minimum: 0 }
        claimChecks:
          type: array
          items:
            type: object
            required: [class, raised, closedByEdit, clearedWithReason]
            properties:
              class: { type: string, enum: [high_risk, other] }
              raised: { type: integer, minimum: 0 }
              closedByEdit: { type: integer, minimum: 0 }
              clearedWithReason: { type: integer, minimum: 0 }
    UsageReportResponse:
      type: object
      required: [success, data, metaData]
      properties:
        success: { type: boolean, const: true }
        data: { $ref: '#/components/schemas/UsageReport' }
        metaData: { $ref: '#/components/schemas/MetaData' }

    HealthResponse:
      type: object
      required: [success, data, metaData]
      properties:
        success: { type: boolean, const: true }
        data:
          type: object
          required: [status]
          additionalProperties: false
          properties:
            status: { type: string, const: ok }
        metaData: { $ref: '#/components/schemas/MetaData' }
    MetricsWindowResponse:
      type: object
      required: [success, data, metaData]
      additionalProperties: false
      properties:
        success: { type: boolean, const: true }
        data: { $ref: '#/components/schemas/MetricsWindow' }
        metaData: { $ref: '#/components/schemas/MetaData' }
    MetricsWindow:
      type: object
      required: [processStartedAt, windows, poolWait, telemetryDropped10m, telemetryDroppedTotal]
      additionalProperties: false
      properties:
        processStartedAt: { $ref: '#/components/schemas/Instant' }
        windows:
          description: Exactly two entries, 10 and 15 minutes, in that order
          type: array
          minItems: 2
          prefixItems:
            - $ref: '#/components/schemas/MetricsWindowSample'
              properties:
                minutes: { const: 10 }
            - $ref: '#/components/schemas/MetricsWindowSample'
              properties:
                minutes: { const: 15 }
          items: false
        poolWait: { $ref: '#/components/schemas/PoolWaitSample' }
        telemetryDropped10m:
          description: |
            Error-reporter and heartbeat events dropped over the last 10 minutes (same window end as `windows[0].to`).
            ALR-9 input: the alert fires when this is above 0 (TD-D42).
          type: integer
          minimum: 0
        telemetryDroppedTotal:
          description: Error-reporter and heartbeat events dropped since process start (same counter as API-902 `telemetry_dropped_total`); not an alert input
          type: integer
          minimum: 0
    MetricsWindowSample:
      type: object
      required: [minutes, from, to, requests, errors5xx, p95Ms]
      additionalProperties: false
      properties:
        minutes: { type: integer, enum: [10, 15] }
        from: { $ref: '#/components/schemas/Instant' }
        to: { $ref: '#/components/schemas/Instant' }
        requests: { type: integer, minimum: 0 }
        errors5xx: { type: integer, minimum: 0 }
        p95Ms: { type: [number, 'null'], minimum: 0 }
    PoolWaitSample:
