openapi: 3.1.0
info:
  title: ShrooMap AI UGC Ad Director API
  version: 1.0.0-design.5
  license:
    name: Proprietary (ShrooMap internal)
    identifier: LicenseRef-Proprietary
  summary: REST contract for apps/api (design revision, AIU-13). Source of truth for packages/contracts/openapi.yaml after G2.
  description: |
    Design artifact produced by AIU-13 (technical design). It implements the operation IDs, owners, scopes and
    error codes frozen in AIU-12 `shared-boundaries` (rev 3561aefa, plus the v3 delta listed in ARCHITECTURE.md §3.9).
    Nothing here authorizes implementation before G2.

    Conventions (ARCHITECTURE.md §3):
    - Every JSON response uses the envelope `{success, data, metaData}` or `{success:false, error, metaData}`.
    - `metaData.requestId` equals the `X-Request-ID` response header. `metaData.timestamp` is the server's UTC time.
    - Error `code` values are the lowercase snake_case registry codes (ADR-010). Clients branch on `code`, never on `message`.
    - IDs are UUIDv7 strings. Instants are RFC 3339 UTC. Money is a decimal string with 4 fraction digits (USD).
    - Lists use forward-only cursor pagination (`limit` 1..50, default 20; signed opaque `cursor`).
    - `x-api-id` is the stable operation ID used by screens, tests and tickets. `x-owner` is the owning module.
    - `x-scope`: U (active linked user, own records), U+RA (U plus recent auth and MFA), A (admin, MFA, recent auth),
      T (verified token without a users row), Pub (no auth), M (metrics token: `Authorization: Bearer <METRICS_TOKEN>`,
      no user session; TD-D41). An M operation answers a missing or wrong token, or a deployment without `METRICS_TOKEN`,
      with 404 `not_found` and the same body as an unknown path, never 401 or 403, so the token check gives no oracle.
    - Paths: user and admin operations are under `/api/v1`; the health probes (API-900, 901) and the internal metrics
      operations (API-902, 903) override `servers` with `/` and are served at the root. Both groups are exempt from the
      user and IP rate limits and are not counted in the metrics windows.
    - `x-job-creating: true` marks the SB-D14 operations: Idempotency-Key required, reuse, key → cap → reserve, rate limit,
      never refused for the running limit. A video job created while the owner already has RUNNING_JOBS_PER_USER jobs
      running is accepted as 202 with the job `pending`; the worker claims it when the running count drops below the limit
      (TD-D38). 429 `rate_limited` comes only from the job-creation rate limit; 422 only from caps, keys and rule checks.
      If the price table has no row effective now for the provider operation whose estimate the call reserves, the call is
      503 `service_unavailable` and nothing is created: no job, no reservation, no idempotency record, so the same key
      works after the fix (TD-D39).
    - `x-error-codes` lists every error code the operation may return in addition to the common ones
      (`unauthenticated`, `not_linked`, `account_suspended`, `account_removed`, `mfa_required`, `rate_limited`,
      `internal_error`, `service_unavailable`, `validation_failed` for malformed input, `method_not_allowed`).
    - Every authenticated operation declares `400` (malformed path, query, header or body), `401`, `403`, `429`
      (general limit, with `Retry-After`), `500` and `503` responses, so generated clients and per-status tests see them.
      `405` is produced by the router for an unsupported method and is not repeated per operation; its shape is
      `components.responses.MethodNotAllowed` (TD-D37).
    - Order (TD-D34): the router decides first. A path template the contract declares, called with a method it does not
      declare, is 405 `method_not_allowed` with an `Allow` header; a path no template matches is 404 `not_found`. Both are
      decided from the path template only (never a record lookup) and before authentication, so they are the same with or
      without a token and never 401. `Allow` lists the methods declared for that path template, plus `HEAD` when `GET` is
      declared, never `OPTIONS`, upper case, in the order `GET, HEAD, POST, PUT, PATCH, DELETE`, joined by ", " (a path with
      `GET` and `POST` → `Allow: GET, HEAD, POST`).
    - Timeouts (TD-D40): one server-wide request timeout of 60 s. A request whose headers and body are not fully received
      in time is answered 408 by the server and closed; that 408 is not enveloped. The timeout does not bound handler time:
      a database statement or lock timeout is 503 `service_unavailable` (enveloped). A cut at the hosting edge is the edge's
      502/504, not enveloped.
    - Browser access (TD-D40): authentication is Bearer only and the API reads no cookies, so there is no CSRF check and no
      CSRF status. CORS allows only the web origin (exact match). The API never refuses by origin: a preflight from another
      origin gets 204 without `Access-Control-Allow-Origin`, and the browser blocks it; no response carries
      `Access-Control-Allow-Origin: *`. A CORS refusal therefore has no status of its own.
servers:
  - url: /api/v1
security:
  - sessionBearer: []
tags:
  - name: identity
    description: Account, linking, invitations, access requests, roles, signup mode
  - name: provider-keys
    description: User-supplied provider keys (write-only) and key events
  - name: campaigns
    description: Drafts and campaign history
  - name: media
    description: Uploads, media records and signed URLs
  - name: brief
    description: Image analysis, brief generation, edits, claim issues
  - name: production
    description: Segment clips, audio QC, assembly, thumbstopper
  - name: lifecycle
    description: Campaign deletion, suspend, reinstate, removal and erasure
  - name: audit
    description: Administrator alerts
  - name: reporting
    description: Admin usage and cost report
  - name: platform
    description: Health endpoints and internal metrics (API-900..903)

paths:
  /me:
    get:
      tags: [identity]
      operationId: getMe
      summary: Current account, link state, MFA state and key notices
      description: |
        Also accepts a verified token with no users row (scope T) and then returns `linkState: not_linked`.
        The auth guard links the account on first verified token when a valid invitation, an approved access request,
        the guarded open mode or the first-admin rule applies (FLOW-12). Linking is idempotent.
      x-api-id: API-001
      x-owner: identity
      x-scope: U, T
      x-error-codes: []
      responses:
        '200':
          description: Account view
          headers: { X-Request-ID: { $ref: '#/components/headers/XRequestId' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /access-requests:
    post:
      tags: [identity]
      operationId: createAccessRequest
      summary: Request access (only when ACCESS_REQUEST_FORM_ENABLED is true)
      description: |
        The requester's email and subject come from the verified token and the identity provider, never from the body.
        The response is identical whether a request already exists, was declined, or was created (no enumeration).
        When the form is disabled the route returns 404 `not_found`.
      x-api-id: API-002
      x-owner: identity
      x-scope: T
      x-error-codes: [not_found]
      x-rate-limit: 3 per hour per subject; 20 per hour per client IP
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccessRequestCreate' }
      responses:
        '202':
          description: Request recorded or already pending
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccessRequestAcceptedResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /me/provider-keys:
    get:
      tags: [provider-keys]
      operationId: listMyProviderKeys
      summary: Status of my provider keys (never the key)
      x-api-id: API-010
      x-owner: provider-keys
      x-scope: U
      x-error-codes: []
      responses:
        '200':
          description: One entry per provider (openai, wavespeed), configured or not
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProviderKeyListResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /me/provider-keys/{provider}:
    parameters:
      - $ref: '#/components/parameters/Provider'
    put:
      tags: [provider-keys]
      operationId: putMyProviderKey
      summary: Add or replace my key for one provider (format check, non-billing probe, seal)
      description: |
        Requires recent authentication (RECENT_AUTH_MAX_AGE) and MFA per MFA_REQUIRED_FOR. Request body logging is off.
        A probe 401 refuses the key (422 `key_invalid`) and stores nothing. A probe timeout, provider error, or a provider
        without a non-billing call stores the key as `untested`. Replacement is atomic (version + 1); a failed replacement
        leaves the old key unchanged. Jobs in flight on the replaced key fail with cause `key_replaced` (the screen warns
        first using `inFlightJobCount` from API-010).
      x-api-id: API-011
      x-owner: provider-keys
      x-scope: U+RA
      x-error-codes: [recent_auth_required, key_invalid]
      x-rate-limit: 5 attempts per account per 10 minutes (KEY_ENTRY_ATTEMPTS_PER_WINDOW); the sixth gets 429 and a key event
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProviderKeyPut' }
      responses:
        '200':
          description: Stored; returns status, hint and fingerprint only
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProviderKeyPutResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/BusinessRule' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    delete:
      tags: [provider-keys]
      operationId: deleteMyProviderKey
      summary: Hard-delete my key for one provider
      description: Jobs in flight on the key fail with cause `key_deleted`. Writes a key event and an audit event.
      x-api-id: API-012
      x-owner: provider-keys
      x-scope: U+RA
      x-error-codes: [recent_auth_required, not_found]
      responses:
        '204':
          description: Deleted (no body)
          headers: { X-Request-ID: { $ref: '#/components/headers/XRequestId' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /me/key-events:
    get:
      tags: [provider-keys]
      operationId: listMyKeyEvents
      summary: My key-event trail (never values)
      x-api-id: API-013
      x-owner: provider-keys
      x-scope: U
      x-error-codes: []
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: provider
          in: query
          required: false
          schema: { $ref: '#/components/schemas/ProviderName' }
      responses:
        '200':
          description: Newest first, ordered by (at desc, id desc)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KeyEventPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /drafts:
    get:
      tags: [campaigns]
      operationId: listDrafts
      summary: My unsubmitted drafts (Drafts tab)
      x-api-id: API-020
      x-owner: campaigns
      x-scope: U
      x-error-codes: []
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Drafts with campaignId null, ordered by (updated_at desc, id desc)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DraftPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    post:
      tags: [campaigns]
      operationId: createDraft
      summary: Start a new draft ("Start over" creates a fresh one)
      x-api-id: API-021
      x-owner: campaigns
      x-scope: U
      x-error-codes: [media_not_ready, state_conflict]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DraftWrite' }
      responses:
        '201':
          description: Created
          headers:
            Location: { $ref: '#/components/headers/Location' }
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DraftResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/BusinessRule' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /drafts/{draftId}:
    parameters:
      - $ref: '#/components/parameters/DraftId'
    get:
      tags: [campaigns]
      operationId: getDraft
      summary: One draft (read-only with campaignId once submitted)
      x-api-id: API-022
      x-owner: campaigns
      x-scope: U
      x-error-codes: [not_found]
      responses:
        '200':
          description: Draft
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DraftResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    patch:
      tags: [campaigns]
      operationId: patchDraft
      summary: Save a step (optimistic version in If-Match)
      x-api-id: API-023
      x-owner: campaigns
      x-scope: U
      x-error-codes: [not_found, version_conflict, state_conflict, media_not_ready]
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DraftPatch' }
      responses:
        '200':
          description: Saved
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DraftResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/BusinessRule' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    delete:
      tags: [campaigns]
      operationId: deleteDraft
      summary: Delete an unsubmitted draft and its product image
      x-api-id: API-025
      x-owner: campaigns
      x-scope: U
      x-error-codes: [not_found, state_conflict]
      responses:
        '204':
          description: Deleted (no body)
          headers: { X-Request-ID: { $ref: '#/components/headers/XRequestId' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /drafts/{draftId}/submit:
    parameters:
      - $ref: '#/components/parameters/DraftId'
    post:
      tags: [campaigns]
      operationId: submitDraft
      summary: Submit a complete draft; creates the campaign and the brief-generation job
      description: |
        One transaction: validate completeness, create the campaign, set drafts.campaign_id (unique), attach the product
        image to the campaign, create the brief and the brief_generation job with its reservation, enqueue. A second
        submit returns the same campaign and job (`reused: true`), with or without the same Idempotency-Key (SB-D1, SB-D13).
      x-api-id: API-024
      x-owner: campaigns
      x-scope: U
      x-job-creating: true
      x-error-codes: [not_found, idempotency_key_reused, key_missing, key_disabled, spend_cap_reached, media_not_ready]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: Campaign created (or replayed) and brief generation accepted
          headers:
            Location: { $ref: '#/components/headers/Location' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubmitDraftResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/BusinessRule' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /media:
    post:
      tags: [media]
      operationId: uploadMedia
      summary: Upload a product image into quarantine (10 MiB, JPEG/PNG/WebP/GIF by magic bytes)
      description: |
        Size is checked before the body is read (Content-Length and a streaming cap). The quota is checked before storage.
        The bytes go to `q/{userId}/{mediaId}`; the record starts in `processing` and the worker sanitizes it to `ready`
        or `rejected`. The client file name is never used.
      x-api-id: API-030
      x-owner: media
      x-scope: U
      x-error-codes: [payload_too_large, unsupported_media_type, storage_quota_reached]
      x-rate-limit: 30 uploads per account per 10 minutes
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  contentMediaType: application/octet-stream
                  description: The image bytes (single part, at most MEDIA_MAX_UPLOAD_BYTES)
      responses:
        '201':
          description: Accepted into quarantine, state processing
          headers:
            Location: { $ref: '#/components/headers/Location' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MediaResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/BusinessRule' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /media/{mediaId}:
    parameters:
      - $ref: '#/components/parameters/MediaId'
    get:
      tags: [media]
      operationId: getMedia
      summary: Media record state and reject reason
      x-api-id: API-031
      x-owner: media
      x-scope: U
      x-error-codes: [not_found]
      responses:
        '200':
          description: Media record
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MediaResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /media/{mediaId}/url:
    parameters:
      - $ref: '#/components/parameters/MediaId'
    get:
      tags: [media]
      operationId: getMediaUrl
      summary: Short-lived signed GET URL for one ready object (browser purpose)
      description: Issued only after the ownership check. Life MEDIA_BROWSER_URL_TTL (default 300 s, allowed 300..900). Response is `Cache-Control no-store`.
      x-api-id: API-032
      x-owner: media
      x-scope: U
      x-error-codes: [not_found, media_not_ready]
      responses:
        '200':
          description: Signed URL
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SignedUrlResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/BusinessRule' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /media/{mediaId}/analysis:
    parameters:
      - $ref: '#/components/parameters/MediaId'
    post:
      tags: [brief]
      operationId: requestImageAnalysis
      summary: Start (or reuse) a product-only image analysis job on a ready image
      x-api-id: API-035
      x-owner: brief
      x-scope: U
      x-job-creating: true
      x-error-codes: [not_found, media_not_ready, idempotency_key_reused, key_missing, key_disabled, spend_cap_reached]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: Job accepted or reused
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImageAnalysisResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/BusinessRule' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    get:
      tags: [brief]
      operationId: getImageAnalysis
      summary: Latest analysis job and product description for the image
      x-api-id: API-036
      x-owner: brief
